networks:
  streaming-bigdata-network:
    driver: bridge

services:
  # ========================================================
  # TẦNG 3: INGESTION LAYER - KAFKA KRAFT (KHÔNG ZOOKEEPER)
  # ========================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092" # Cổng kết nối nội bộ Docker
      - "9094:9094" # Cổng kết nối từ máy Local ngoài vào (Simulator App)
    environment:
      # Định nghĩa các cổng (Listeners) theo chuẩn Apache
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      
      # Cấu hình chế độ KRaft (Không cần ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      
      # Tạo sẵn một ID định danh cho cụm Cluster KRaft (Bắt buộc với image Apache)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" 
      
      # Chọn cổng giao tiếp giữa các Broker nội bộ
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      
      # Bỏ qua kiểm tra log directory nếu cần
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks:
      - streaming-bigdata-network

  # ========================================================
  # TẦNG 4: PROCESSING LAYER - APACHE SPARK (1 MASTER - 2 WORKERS)
  # ========================================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080" # Web UI Master
      - "7077:7077" # Cổng nhận Job của Cluster
    environment:
      - PYSPARK_PYTHON=python3
    networks:
      - streaming-bigdata-network
    volumes:
    - ./:/opt/spark/apps
    - ./logs:/opt/spark/logs

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: spark-worker-1
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Web UI Worker 1
    environment:
      - PYSPARK_PYTHON=python3
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    networks:
      - streaming-bigdata-network

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: spark-worker-2
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081" # ĐÃ SỬA: Đổi cổng ngoài thành 8082 để không đụng hàng với Worker 1
    environment:
      - PYSPARK_PYTHON=python3
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    networks:
      - streaming-bigdata-network

  # ========================================================
  # TẦNG 5: STORAGE LAYER - HADOOP HDFS CLUSTER & YARN
  # ========================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870" # HDFS Web UI
      - "9000:9000" # Cổng kết nối chính của HDFS
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - hadoop_namenode:/hadoop/dfs/name # ĐÃ SỬA: Namenode chỉ giữ Metadata bản đồ dữ liệu
    networks:
      - streaming-bigdata-network

  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-1
    restart: always
    ports:
      - "9864:9864"
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_datanode_1:/hadoop/dfs/data # ĐÃ SỬA: Lưu data phân tán mảnh số 1
    depends_on:
      - namenode
    networks:
      - streaming-bigdata-network

  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-2
    restart: always
    ports:
      - "9865:9864" # ĐÃ SỬA: Đổi cổng ngoài thành 9865 tránh xung đột
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_datanode_2:/hadoop/dfs/data # ĐÃ SỬA: Lưu data phân tán mảnh số 2
    depends_on:
      - namenode
    networks:
      - streaming-bigdata-network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    ports:
      - "8088:8088" # YARN Resource Manager UI
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode-1:9864 datanode-2:9864 # Đăng ký kiểm tra cả 2 Datanode
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
    networks:
      - streaming-bigdata-network

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    ports:
      - "8042:8042"
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode-1:9864 datanode-2:9864 resourcemanager:8088
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
    networks:
      - streaming-bigdata-network

  # ========================================================
  # TẦNG 5 (TIẾP THEO): STORAGE LAYER - NOSQL MONGODB
  # ========================================================
  mongodb:
    image: mongo:6.0.6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo_data:/data/db
    networks:
      - streaming-bigdata-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8085:8081" # Giữ nguyên cổng 8085 cực tốt của bạn để tránh đụng hàng Spark Worker
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - streaming-bigdata-network

# ========================================================
# ĐỊNH NGHĨA VOLUMES ĐỘC LẬP ĐỂ KHÔNG BỊ TRỘN DỮ LIỆU
# ========================================================
volumes:
  hadoop_namenode:
  hadoop_datanode_1: # Volume vật lý riêng cho Node 1
  hadoop_datanode_2: # Volume vật lý riêng cho Node 2
  mongo_data: